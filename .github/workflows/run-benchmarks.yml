name: Prompt Quality Bench CLI & Benchmark Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-bench:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies & verify wheel and editable builds
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install .
        pip install -e .
        
    - name: Run Test Suite
      env:
        PYTHONPATH: .
      run: |
        python -m pytest -v tests/

    - name: Execute Sample Benchmark Suite
      run: |
        python benchmarks/run_benchmark_suite.py
